name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stale_deployment:
        description: "キャンセルしたい残留デプロイの ID（エラーメッセージの「Please cancel ○○ first」のコミット SHA）。空欄なら自動検出"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 前回のデプロイが GitHub Pages 側で「進行中」のまま残ると、
      # 以降のデプロイが "due to in progress deployment" で失敗し続ける。
      # このワークフローは concurrency で直列化されているため、ここで残っている
      # 過去のデプロイはすべて不要なものとしてキャンセルしてよい。
      - name: Cancel stale Pages deployments
        uses: actions/github-script@v7
        env:
          STALE_DEPLOYMENT: ${{ github.event.inputs.stale_deployment }}
        with:
          script: |
            const { owner, repo } = context.repo
            const ids = new Set()
            if (process.env.STALE_DEPLOYMENT) ids.add(process.env.STALE_DEPLOYMENT.trim())
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, environment: "github-pages", per_page: 10,
            })
            for (const d of deployments) if (d.sha !== context.sha) ids.add(d.sha)
            let cancelled = 0
            for (const id of ids) {
              try {
                await github.request(
                  "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                  { owner, repo, pages_deployment_id: id }
                )
                core.info(`Cancelled Pages deployment ${id}`)
                cancelled++
              } catch (e) {
                // 完了済み・存在しないデプロイは 404 等になるので無視する
                core.info(`Skip ${id}: ${e.status ?? ""} ${e.message}`)
              }
            }
            if (cancelled > 0) await new Promise((r) => setTimeout(r, 15000))

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages 側の反映待ちが長引いた場合に備えて既定の10分から延長
          timeout: 1800000
